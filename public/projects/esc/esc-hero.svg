<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ESC Voting System Beamer und Voting Mockup</title>
  <desc id="desc">Neutralized composite of the ESC party app with beamer stage, live ranking, progress, phone voting and admin control.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#321022"/>
      <stop offset="0.45" stop-color="#090d13"/>
      <stop offset="1" stop-color="#063932"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff477a"/>
      <stop offset="0.54" stop-color="#ffd766"/>
      <stop offset="1" stop-color="#25f4d0"/>
    </linearGradient>
    <linearGradient id="rankGold" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe06b"/>
      <stop offset="1" stop-color="#2a2d35"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .label{fill:#25f4d0;font-weight:900;font-size:22px;text-transform:uppercase}
      .muted{fill:#c9d0dc;font-size:20px}
      .small{fill:#d8deea;font-size:17px;font-weight:700}
      .white{fill:#fff7eb}
      .panel{fill:#171b24;stroke:#334052;stroke-width:2}
      .subpanel{fill:#212735}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <g class="ui" filter="url(#shadow)">
    <text x="66" y="72" class="label">PORTFOLIO ESC 2026</text>
    <text x="66" y="126" class="white" font-size="56" font-weight="900">Finalabend live steuern</text>
    <g transform="translate(1378 62)">
      <rect width="150" height="50" rx="25" fill="#171b24" stroke="#334052" stroke-width="2"/>
      <circle cx="28" cy="25" r="10" fill="#5be35a"/>
      <text x="46" y="23" class="white" font-size="18" font-weight="900">Live</text>
      <text x="46" y="40" fill="#cbd2dd" font-size="13">4 Geraete</text>
    </g>

    <g transform="translate(64 170)">
      <rect class="panel" width="930" height="485" rx="12"/>
      <text x="34" y="60" class="label">TV-Modus</text>
      <text x="34" y="178" class="white" font-size="90" font-weight="900">Germany</text>
      <text x="34" y="230" class="white" font-size="37" font-weight="900">Demo Artist - Fire</text>
      <text x="34" y="280" fill="#25f4d0" font-size="34" font-weight="900">Next: Sweden - My System</text>
      <g transform="translate(34 312)">
        <rect width="860" height="116" rx="12" fill="#202632" stroke="#3a4556" stroke-width="2"/>
        <text x="26" y="36" class="label" font-size="20">Voting-Fortschritt</text>
        <text x="704" y="36" class="small">18 / 24 Bewertungen</text>
        <rect x="26" y="56" width="808" height="14" rx="7" fill="#2a303d"/>
        <rect x="26" y="56" width="610" height="14" rx="7" fill="url(#bar)"/>
        <circle cx="82" cy="96" r="20" fill="#2b3442" stroke="#25f4d0"/>
        <text x="74" y="104" fill="#ffd766" font-size="22" font-weight="900">S</text>
        <text x="122" y="102" class="white" font-size="25" font-weight="900">Sophie</text>
        <text x="720" y="102" fill="#ffd766" font-size="28" font-weight="900">6/6</text>
      </g>
      <g transform="translate(34 116)">
        <rect width="82" height="58" rx="7" fill="#11151d"/>
        <rect x="9" y="9" width="64" height="40" rx="3" fill="#f2c94c"/>
        <rect x="9" y="22" width="64" height="14" fill="#d93035"/>
        <rect x="9" y="9" width="21" height="40" fill="#111111" opacity=".28"/>
      </g>
    </g>

    <g transform="translate(1022 170)">
      <rect class="panel" width="514" height="485" rx="12"/>
      <text x="30" y="60" class="label">Live-Ranking</text>
      <text x="408" y="60" class="small">sichtbar</text>
      <g transform="translate(28 88)">
        <rect width="458" height="64" rx="8" fill="url(#rankGold)" opacity=".84"/>
        <circle cx="32" cy="32" r="21" fill="#ffd766"/>
        <text x="25" y="39" fill="#11151d" font-size="21" font-weight="900">1</text>
        <text x="70" y="29" class="white" font-size="25" font-weight="900">France</text>
        <text x="70" y="52" fill="#f4d8a8" font-size="15">10.8 Schnitt / 65 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 168)">
        <rect width="458" height="64" rx="8" fill="#202632"/>
        <circle cx="32" cy="32" r="21" fill="#ffd766"/>
        <text x="25" y="39" fill="#11151d" font-size="21" font-weight="900">2</text>
        <text x="70" y="29" class="white" font-size="25" font-weight="900">Italy</text>
        <text x="70" y="52" fill="#cbd2dd" font-size="15">9.3 Schnitt / 56 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 248)">
        <rect width="458" height="64" rx="8" fill="#202632"/>
        <circle cx="32" cy="32" r="21" fill="#ffd766"/>
        <text x="25" y="39" fill="#11151d" font-size="21" font-weight="900">3</text>
        <text x="70" y="29" class="white" font-size="25" font-weight="900">Sweden</text>
        <text x="70" y="52" fill="#cbd2dd" font-size="15">8.8 Schnitt / 53 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 342)">
        <rect width="222" height="98" rx="12" fill="#11151d" stroke="#334052"/>
        <text x="18" y="32" class="label" font-size="17">Matrix</text>
        <text x="18" y="66" class="white" font-size="28" font-weight="900">6 x 6</text>
        <text x="18" y="86" fill="#cbd2dd" font-size="14">Bewertungen</text>
        <rect x="262" width="196" height="98" rx="12" fill="#11151d" stroke="#334052"/>
        <text x="280" y="32" class="label" font-size="17">Awards</text>
        <text x="280" y="66" class="white" font-size="28" font-weight="900">9</text>
        <text x="280" y="86" fill="#cbd2dd" font-size="14">Party-Statistiken</text>
      </g>
    </g>

    <g transform="translate(135 600)">
      <rect width="266" height="248" rx="28" fill="#0b0f16" stroke="#384458" stroke-width="3"/>
      <text x="28" y="52" class="label" font-size="18">Voting</text>
      <rect x="28" y="72" width="210" height="42" rx="7" fill="#151a22" stroke="#384458"/>
      <text x="44" y="100" class="white" font-size="18" font-weight="900">Demo-Gast</text>
      <text x="28" y="145" class="white" font-size="24" font-weight="900">Germany</text>
      <g fill="#2a303d">
        <rect x="28" y="166" width="48" height="42" rx="6"/><rect x="82" y="166" width="48" height="42" rx="6"/><rect x="136" y="166" width="48" height="42" rx="6"/><rect x="190" y="166" width="48" height="42" rx="6"/>
      </g>
      <rect x="28" y="166" width="48" height="42" rx="6" fill="#ffd766"/>
      <text x="48" y="193" fill="#11151d" font-size="20" font-weight="900">1</text>
      <text x="101" y="193" class="white" font-size="20" font-weight="900">2</text>
      <text x="155" y="193" class="white" font-size="20" font-weight="900">3</text>
      <text x="209" y="193" class="white" font-size="20" font-weight="900">4</text>
    </g>

    <g transform="translate(439 690)">
      <rect width="680" height="136" rx="12" fill="#171b24" stroke="#334052" stroke-width="2"/>
      <text x="24" y="42" class="label">Admin-Steuerung</text>
      <g transform="translate(24 62)">
        <rect width="148" height="44" rx="7" fill="#fff7eb"/>
        <text x="51" y="29" fill="#11151d" font-size="16" font-weight="900">Lobby</text>
        <rect x="164" width="148" height="44" rx="7" fill="#232a37"/>
        <text x="197" y="29" class="white" font-size="16" font-weight="900">TV-Modus</text>
        <rect x="328" width="148" height="44" rx="7" fill="#232a37"/>
        <text x="370" y="29" class="white" font-size="16" font-weight="900">Ranking</text>
        <rect x="492" width="148" height="44" rx="7" fill="#232a37"/>
        <text x="533" y="29" class="white" font-size="16" font-weight="900">Stats</text>
      </g>
    </g>
  </g>
</svg>
