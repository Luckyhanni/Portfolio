<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ESC Voting System Live Results Mockup</title>
  <desc id="desc">Neutralized live beamer and party statistics screen with current act, ranking, progress and award cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#321022"/>
      <stop offset="0.45" stop-color="#090d13"/>
      <stop offset="1" stop-color="#063932"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff477a"/>
      <stop offset="0.55" stop-color="#ffd766"/>
      <stop offset="1" stop-color="#25f4d0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .panel{fill:#171b24;stroke:#334052;stroke-width:2}
      .row{fill:#202632}
      .label{fill:#25f4d0;font-size:19px;font-weight:900;text-transform:uppercase}
      .white{fill:#fff7eb}
      .muted{fill:#cbd2dd}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g class="ui" filter="url(#shadow)">
    <g transform="translate(52 44)">
      <text x="0" y="0" class="label">PORTFOLIO ESC 2026</text>
      <text x="0" y="55" class="white" font-size="58" font-weight="900">Vienna 2026</text>
    </g>
    <g transform="translate(1422 40)">
      <rect width="126" height="50" rx="25" fill="#171b24" stroke="#334052" stroke-width="2"/>
      <circle cx="26" cy="25" r="10" fill="#5be35a"/>
      <text x="44" y="23" class="white" font-size="17" font-weight="900">Live</text>
      <text x="44" y="40" class="muted" font-size="13">4 Geraete</text>
    </g>

    <g transform="translate(52 138)">
      <rect class="panel" width="950" height="388" rx="10"/>
      <text x="34" y="152" class="label">Act 2</text>
      <g transform="translate(34 176)">
        <rect width="82" height="58" rx="7" fill="#11151d"/>
        <rect x="9" y="9" width="64" height="40" rx="3" fill="#f2c94c"/>
        <rect x="9" y="9" width="64" height="13" fill="#111111"/>
        <rect x="9" y="36" width="64" height="13" fill="#d93035"/>
      </g>
      <text x="136" y="238" class="white" font-size="78" font-weight="900">Germany</text>
      <text x="34" y="294" class="white" font-size="36" font-weight="900">Demo Artist - Fire</text>
      <text x="34" y="342" fill="#25f4d0" font-size="32" font-weight="900">Next: Sweden - My System</text>
    </g>

    <g transform="translate(1020 138)">
      <rect class="panel" width="528" height="388" rx="10"/>
      <text x="30" y="48" class="label">Live-Ranking</text>
      <text x="438" y="48" class="muted" font-size="17" font-weight="800">sichtbar</text>
      <g transform="translate(28 78)">
        <rect width="472" height="54" rx="8" fill="#3d3b33"/>
        <circle cx="30" cy="27" r="20" fill="#ffd766"/>
        <text x="24" y="35" fill="#11151d" font-size="20" font-weight="900">1</text>
        <text x="68" y="25" class="white" font-size="25" font-weight="900">France</text>
        <text x="68" y="45" fill="#f3d4a4" font-size="14">10.8 Schnitt / 65 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 146)">
        <rect width="472" height="54" rx="8" class="row"/>
        <circle cx="30" cy="27" r="20" fill="#ffd766"/>
        <text x="24" y="35" fill="#11151d" font-size="20" font-weight="900">2</text>
        <text x="68" y="25" class="white" font-size="25" font-weight="900">Italy</text>
        <text x="68" y="45" class="muted" font-size="14">9.3 Schnitt / 56 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 214)">
        <rect width="472" height="54" rx="8" class="row"/>
        <circle cx="30" cy="27" r="20" fill="#ffd766"/>
        <text x="24" y="35" fill="#11151d" font-size="20" font-weight="900">3</text>
        <text x="68" y="25" class="white" font-size="25" font-weight="900">Sweden</text>
        <text x="68" y="45" class="muted" font-size="14">8.8 Schnitt / 53 P / 6 Stimmen</text>
      </g>
      <g transform="translate(28 282)">
        <rect width="472" height="54" rx="8" class="row"/>
        <circle cx="30" cy="27" r="20" fill="#ffd766"/>
        <text x="24" y="35" fill="#11151d" font-size="20" font-weight="900">4</text>
        <text x="68" y="25" class="white" font-size="25" font-weight="900">Finland</text>
        <text x="68" y="45" class="muted" font-size="14">8.0 Schnitt / 48 P / 6 Stimmen</text>
      </g>
    </g>

    <g transform="translate(52 548)">
      <rect class="panel" width="1496" height="128" rx="10"/>
      <text x="28" y="42" class="label">Voting-Fortschritt</text>
      <text x="1320" y="42" class="white" font-size="17" font-weight="900">24 / 24 Bewertungen abgegeben</text>
      <rect x="28" y="66" width="1440" height="13" rx="7" fill="#27303d"/>
      <rect x="28" y="66" width="1440" height="13" rx="7" fill="url(#bar)"/>
      <circle cx="76" cy="102" r="20" fill="#232a36" stroke="#25f4d0"/>
      <text x="68" y="110" fill="#ffd766" font-size="22" font-weight="900">S</text>
      <text x="118" y="110" class="white" font-size="27" font-weight="900">Sophie</text>
      <text x="1404" y="110" fill="#ffd766" font-size="27" font-weight="900">6/6</text>
    </g>

    <g transform="translate(52 704)">
      <text x="0" y="0" class="label">Party-Statistiken</text>
      <g transform="translate(0 26)">
        <rect class="panel" width="358" height="132" rx="10"/>
        <text x="22" y="36" class="label" font-size="16">Publikumsliebling</text>
        <text x="22" y="75" class="white" font-size="30" font-weight="900">France</text>
        <text x="22" y="104" class="white" font-size="18" font-weight="800">Ø 10.8 Punkte</text>
      </g>
      <g transform="translate(380 26)">
        <rect class="panel" width="358" height="132" rx="10"/>
        <text x="22" y="36" class="label" font-size="16">12-Punkte-Koenig</text>
        <text x="22" y="75" class="white" font-size="30" font-weight="900">Italy</text>
        <text x="22" y="104" class="white" font-size="18" font-weight="800">3x die 12 Punkte</text>
      </g>
      <g transform="translate(760 26)">
        <rect class="panel" width="358" height="132" rx="10"/>
        <text x="22" y="36" class="label" font-size="16">Kritischste Person</text>
        <text x="22" y="75" class="white" font-size="30" font-weight="900">Alex</text>
        <text x="22" y="104" class="white" font-size="18" font-weight="800">Ø 5.2 Punkte</text>
      </g>
      <g transform="translate(1140 26)">
        <rect class="panel" width="356" height="132" rx="10"/>
        <text x="22" y="36" class="label" font-size="16">Favorite-Koenig</text>
        <text x="22" y="75" class="white" font-size="30" font-weight="900">Sweden</text>
        <text x="22" y="104" class="white" font-size="18" font-weight="800">3 Favorite-Markierungen</text>
      </g>
    </g>
  </g>
</svg>
