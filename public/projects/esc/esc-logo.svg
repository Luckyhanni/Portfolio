<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ESC Voting System Logo</title>
  <desc id="desc">Dark app icon with ESC lettering, live dot, score card, and cyan pink accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#321022"/>
      <stop offset="0.48" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#06342f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff477a"/>
      <stop offset="0.55" stop-color="#ffd766"/>
      <stop offset="1" stop-color="#25f4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="45" y="45" width="422" height="422" rx="74" fill="#151922" stroke="#334052" stroke-width="3" filter="url(#shadow)"/>
  <rect x="82" y="88" width="348" height="14" rx="7" fill="url(#accent)"/>
  <circle cx="390" cy="142" r="16" fill="#5be35a"/>
  <text x="112" y="180" fill="#25f4d0" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="800">LIVE VOTING</text>
  <text x="84" y="305" fill="#fff6e9" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900" letter-spacing="-2">ESC</text>
  <g transform="translate(108 338)">
    <rect width="296" height="78" rx="26" fill="#212735" stroke="#3a4556" stroke-width="3"/>
    <circle cx="48" cy="39" r="26" fill="#ffd766"/>
    <text x="40" y="50" fill="#11151d" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900">12</text>
    <text x="92" y="47" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="800">POINTS</text>
  </g>
</svg>
