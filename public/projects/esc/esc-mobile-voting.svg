<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">ESC Voting System Mobile Voting Mockup</title>
  <desc id="desc">Neutralized phone voting screen with name input, progress, Favorite, Cringe and point grid from one to twelve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#321022"/>
      <stop offset="0.5" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#053a33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff477a"/>
      <stop offset="0.55" stop-color="#ffd766"/>
      <stop offset="1" stop-color="#25f4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .panel{fill:#171b24;stroke:#334052;stroke-width:2}
      .tile{fill:#2a303d}
      .label{fill:#25f4d0;font-size:20px;font-weight:900;text-transform:uppercase}
      .white{fill:#fff7eb}
      .muted{fill:#cbd2dd}
    </style>
  </defs>
  <rect width="720" height="1280" fill="url(#bg)"/>
  <g class="ui" filter="url(#shadow)">
    <rect x="54" y="36" width="612" height="1208" rx="48" fill="#0b0f16" stroke="#313b4c" stroke-width="4"/>
    <rect x="78" y="74" width="564" height="1132" rx="34" fill="#11151d"/>
    <g transform="translate(104 106)">
      <text x="0" y="0" class="label">PORTFOLIO ESC 2026</text>
      <text x="0" y="56" class="white" font-size="46" font-weight="900">Voting</text>
      <g transform="translate(418 -21)">
        <rect width="96" height="38" rx="19" fill="#1b2230" stroke="#334052"/>
        <circle cx="20" cy="19" r="8" fill="#5be35a"/>
        <text x="34" y="25" class="white" font-size="15" font-weight="900">Live</text>
      </g>
    </g>

    <g transform="translate(104 196)">
      <rect class="panel" width="512" height="190" rx="12"/>
      <text x="24" y="42" fill="#d8c8b6" font-size="21" font-weight="800">Dein Name</text>
      <rect x="24" y="62" width="464" height="64" rx="8" fill="#0e131a" stroke="#3b4556"/>
      <text x="44" y="103" class="white" font-size="25" font-weight="900">Demo-Gast</text>
      <rect x="24" y="146" width="464" height="54" rx="9" fill="#ff477a"/>
      <text x="174" y="180" class="white" font-size="23" font-weight="900">Punkte speichern</text>
    </g>

    <g transform="translate(104 416)">
      <text x="0" y="0" fill="#fff7eb" font-size="26" font-weight="900">4 / 6 bewertet</text>
      <rect x="0" y="24" width="512" height="12" rx="6" fill="#26303d"/>
      <rect x="0" y="24" width="342" height="12" rx="6" fill="url(#bar)"/>
    </g>

    <g transform="translate(104 482)">
      <rect class="panel" width="512" height="86" rx="12"/>
      <text x="24" y="34" class="label">Dein Favorite</text>
      <text x="24" y="64" class="white" font-size="23" font-weight="900">Sweden - My System</text>
    </g>
    <g transform="translate(104 584)">
      <rect class="panel" width="512" height="86" rx="12"/>
      <text x="24" y="34" class="label">Dein Cringe</text>
      <text x="24" y="64" class="white" font-size="23" font-weight="900">Noch nicht gewaehlt</text>
    </g>

    <g transform="translate(104 700)">
      <rect class="panel" width="512" height="430" rx="12"/>
      <circle cx="54" cy="58" r="30" fill="#232a36"/>
      <text x="45" y="68" fill="#ffd766" font-size="25" font-weight="900">1</text>
      <text x="100" y="50" class="white" font-size="28" font-weight="900">Germany</text>
      <text x="100" y="80" class="muted" font-size="21">Demo Artist - Fire</text>
      <g transform="translate(24 118)">
        <rect width="104" height="90" rx="7" fill="#ffd766"/>
        <rect x="116" width="104" height="90" rx="7" class="tile"/>
        <rect x="232" width="104" height="90" rx="7" class="tile"/>
        <rect x="348" width="104" height="90" rx="7" class="tile"/>
        <rect y="104" width="104" height="90" rx="7" class="tile"/>
        <rect x="116" y="104" width="104" height="90" rx="7" class="tile"/>
        <rect x="232" y="104" width="104" height="90" rx="7" class="tile"/>
        <rect x="348" y="104" width="104" height="90" rx="7" class="tile"/>
        <rect y="208" width="104" height="90" rx="7" class="tile"/>
        <rect x="116" y="208" width="104" height="90" rx="7" class="tile"/>
        <rect x="232" y="208" width="104" height="90" rx="7" class="tile"/>
        <rect x="348" y="208" width="104" height="90" rx="7" class="tile"/>
        <text x="47" y="56" fill="#11151d" font-size="25" font-weight="900">1</text>
        <text x="162" y="56" class="white" font-size="25" font-weight="900">2</text>
        <text x="278" y="56" class="white" font-size="25" font-weight="900">3</text>
        <text x="394" y="56" class="white" font-size="25" font-weight="900">4</text>
        <text x="47" y="160" class="white" font-size="25" font-weight="900">5</text>
        <text x="162" y="160" class="white" font-size="25" font-weight="900">6</text>
        <text x="278" y="160" class="white" font-size="25" font-weight="900">7</text>
        <text x="394" y="160" class="white" font-size="25" font-weight="900">8</text>
        <text x="47" y="264" class="white" font-size="25" font-weight="900">9</text>
        <text x="157" y="264" class="white" font-size="25" font-weight="900">10</text>
        <text x="273" y="264" class="white" font-size="25" font-weight="900">11</text>
        <text x="389" y="264" class="white" font-size="25" font-weight="900">12</text>
      </g>
      <g transform="translate(24 376)">
        <rect width="218" height="48" rx="8" fill="#202633" stroke="#384458"/>
        <text x="68" y="31" class="white" font-size="20" font-weight="900">Favorite</text>
        <rect x="250" width="218" height="48" rx="8" fill="#202633" stroke="#384458"/>
        <text x="323" y="31" class="white" font-size="20" font-weight="900">Cringe</text>
      </g>
    </g>

    <g transform="translate(104 1152)">
      <rect class="panel" width="512" height="62" rx="12" opacity=".9"/>
      <circle cx="52" cy="31" r="22" fill="#232a36"/>
      <text x="44" y="39" fill="#ffd766" font-size="20" font-weight="900">2</text>
      <text x="92" y="38" class="white" font-size="24" font-weight="900">Sweden</text>
      <text x="378" y="38" fill="#25f4d0" font-size="20" font-weight="900">12 Punkte</text>
    </g>
  </g>
</svg>
